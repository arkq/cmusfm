name: CI - Build and Test

on:
  push:
  pull_request:
    branches: [ master ]

jobs:
  build:
    strategy:
      matrix:
        features:
          - -DENABLE_DEBUG=ON -DENABLE_MANPAGES=ON
          - -DENABLE_LIBNOTIFY=ON
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Dependencies
        uses: gerlero/apt-install@v1
        with:
          packages: >
            libcurl4-openssl-dev
            libnotify-dev
            python3-docutils
      - name: Configure CMake
        run: cmake -S . -B build -DBUILD_TESTING=ON ${{ matrix.features }}
      - name: Build
        run: cmake --build build --parallel
      - name: Run Tests
        run: ctest --test-dir build --parallel --output-on-failure
